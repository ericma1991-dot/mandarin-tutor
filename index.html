<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣華語 Tutor — Taiwanese Mandarin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1EFEA; --card:#FBFAF7; --ink:#1B2528; --ink2:#4A5A60; --ink3:#7C8A8E;
  --seal:#C8321E; --seal-dk:#A22314; --jade:#20705F; --jade-lt:#E3EEEA;
  --gold:#B98A2F; --line:#DAD6CB; --line2:#E8E5DD;
  --serif:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
  --mono:"IBM Plex Mono","Menlo",monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;min-height:100vh}
::selection{background:var(--seal);color:#fff}
button{font-family:var(--sans);cursor:pointer}
a{color:var(--jade)}
.zh{font-family:var(--serif)}
.py{font-family:var(--mono);color:var(--jade);letter-spacing:.01em}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:218px;flex-shrink:0;background:var(--ink);color:#EDEAE2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
#main{flex:1;min-width:0;padding:34px 44px 90px;max-width:1060px}
@media(max-width:860px){
  #app{flex-direction:column}
  #side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:6px 10px}
  #side .brand{padding:10px 8px;border:none}
  #side nav{display:flex;flex-wrap:wrap;flex:1;padding:0}
  #side .navbtn{padding:8px 10px;border-left:none;font-size:13px}
  #side .navbtn .seal{width:22px;height:22px;font-size:12px}
  #side .side-foot{display:none}
  #main{padding:20px 16px 80px}
}

/* ---------- sidebar ---------- */
.brand{padding:26px 20px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .big{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.25;letter-spacing:.06em}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:#9FB0AC;margin-top:6px;text-transform:uppercase;letter-spacing:.14em}
#side nav{padding:14px 0;flex:1}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:#C9CFC9;padding:10px 20px;font-size:14.5px;text-align:left;border-left:3px solid transparent;transition:background .15s}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{color:#fff;border-left-color:var(--seal);background:rgba(200,50,30,.14)}
.seal{width:26px;height:26px;flex-shrink:0;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.navbtn.on .seal{background:var(--seal)}
.navbtn .seal{background:#39474C}
.side-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#8B9A97}
.side-foot .streakline{display:flex;align-items:center;gap:8px;color:#EDEAE2;font-size:13px}
.side-foot .streakline .seal{width:22px;height:22px;font-size:11px;background:var(--seal)}

/* ---------- generic ---------- */
h1.pagetitle{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.02em}
.pagesub{color:var(--ink2);margin:4px 0 26px;font-size:14.5px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--seal);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.btn{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14.5px;font-weight:500;transition:transform .1s, opacity .15s}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn.red{background:var(--seal)}
.btn.jade{background:var(--jade)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn.ghost:hover{border-color:var(--ink2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:2px 8px;border-radius:20px;background:var(--jade-lt);color:var(--jade);margin-right:5px;vertical-align:middle}
.tag.red{background:#F7E3DF;color:var(--seal)}
.tag.gold{background:#F3EAD5;color:#8A6516}
.tag.gray{background:#E7E5DE;color:var(--ink2)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink3);font-size:13px}
.hr{border:none;border-top:1px solid var(--line2);margin:16px 0}
input[type=text],input[type=number],textarea,select{font-family:var(--sans);font-size:15px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:var(--jade)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.big-zh{font-family:var(--serif);font-weight:900;font-size:56px;line-height:1.2;letter-spacing:.04em}
.correct{color:var(--jade);font-weight:700}
.wrong{color:var(--seal);font-weight:700}
.stampwrap{display:inline-flex}
.stamp{width:64px;height:64px;background:var(--seal);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:30px;box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.3), 0 2px 8px rgba(162,35,20,.3);transform:rotate(-4deg);animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:scale(2.1) rotate(8deg);opacity:0}60%{transform:scale(.95) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
.progressbar{height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.progressbar>div{height:100%;background:var(--jade);border-radius:6px;transition:width .4s}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:9px;font-size:15px;transition:border-color .12s}
.choice:hover{border-color:var(--ink2)}
.choice.picked-ok{border-color:var(--jade);background:var(--jade-lt)}
.choice.picked-bad{border-color:var(--seal);background:#F9E9E6}
.choice:disabled{cursor:default;opacity:.75}
.levelchip{font-family:var(--mono);font-size:11px;background:var(--ink);color:#fff;border-radius:5px;padding:2px 7px}
.tok{cursor:pointer;border-radius:4px;padding:1px 1px;transition:background .12s}
.tok:hover{background:#EFE3C9}
.tok.hasdef{border-bottom:2px dotted var(--gold)}
.reading-zh{font-family:var(--serif);font-size:23px;line-height:2.15;font-weight:600}
.rubytop{display:block;font-family:var(--mono);font-size:10px;color:var(--jade);text-align:center;line-height:1;margin-bottom:2px;min-height:10px}
.tokv{display:inline-block;vertical-align:bottom;text-align:center;margin:0 1px}
#tip{position:fixed;background:var(--ink);color:#fff;padding:9px 13px;border-radius:8px;font-size:13.5px;max-width:280px;z-index:99;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none}
#tip .py{color:#8FD4C4}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;font-size:14px;z-index:100;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.flashcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:38px 30px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.flashcard .domtags{position:absolute;top:14px;left:14px}
.flashcard .srsinfo{position:absolute;top:14px;right:14px}
.gradebtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.gradebtns .btn{min-width:96px}
.speakbox{border:1.5px dashed var(--line);border-radius:10px;padding:14px;background:#fff;margin-top:10px}
.transcript{font-family:var(--serif);font-size:19px;min-height:28px}
.dlgline{display:flex;gap:12px;margin-bottom:14px}
.dlgline .who{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;color:#fff;font-size:15px}
.dlgline.them .who{background:var(--ink)}
.dlgline.you .who{background:var(--jade)}
.dlgbubble{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:640px}
.dlgline.you .dlgbubble{background:var(--jade-lt);border-color:#CBE0DA}
.dlg-zh{font-family:var(--serif);font-size:19px;font-weight:600}
.dlg-py{font-family:var(--mono);font-size:12px;color:var(--jade);margin-top:2px}
.dlg-en{font-size:13px;color:var(--ink2);margin-top:2px}
.objbox{background:#FDF7EC;border:1.5px solid #E8D9B8;border-radius:10px;padding:12px 16px;margin:12px 0}
.audiobtn{background:var(--ink);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:16px;flex-shrink:0}
.audiobtn:hover{opacity:.85}
.audiobtn.sm{width:28px;height:28px;font-size:12px}
table.stats{width:100%;border-collapse:collapse;font-size:14px}
table.stats td,table.stats th{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left}
table.stats th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2)}
.lvlband{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.lvlseg{flex:1;padding:12px 8px;text-align:center;border-right:1px solid var(--line2);background:#fff;min-width:74px}
.lvlseg:last-child{border-right:none}
.lvlseg.done{background:var(--jade-lt)}
.lvlseg.cur{background:var(--ink);color:#fff}
.lvlseg.cur .py,.lvlseg.cur .muted{color:#9FD0C2}
.lvlseg .zh{font-weight:900;font-size:19px}
.lvlseg .muted{font-size:10.5px}
.vocabrow{display:flex;align-items:baseline;gap:14px;padding:9px 4px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.vocabrow .zh{font-size:20px;font-weight:600;min-width:110px}
.vocabrow .py{font-size:12.5px;min-width:120px}
.vocabrow .en{color:var(--ink2);font-size:14px;flex:1}
details.lesson{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:12px}
details.lesson>summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:15.5px;list-style:none;display:flex;align-items:center;gap:10px}
details.lesson>summary::-webkit-details-marker{display:none}
details.lesson[open]>summary{border-bottom:1px solid var(--line2)}
details.lesson .inner{padding:16px 18px}
.reslink{display:block;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;text-decoration:none;color:var(--ink);transition:border-color .12s}
.reslink:hover{border-color:var(--jade)}
.reslink .t{font-weight:700}
.reslink .d{font-size:13px;color:var(--ink2)}
.reslink .u{font-family:var(--mono);font-size:11px;color:var(--jade)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.focusring:focus-visible{outline:3px solid var(--gold)}
</style>
</head>
<body>
<div id="tip"></div>
<div id="toast"></div>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="big">台灣華語<br>Tutor</div>
      <div class="sub">Traditional · zh-TW · Offline</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="streakline"><span class="seal" id="streakSeal">0</span> session streak</div>
      <div id="sideLevel" style="margin-top:6px"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
/* ============ VOCAB BANK ============
 c=character(trad) p=pinyin(Taiwan reading) e=english l=level d=domains
 x=[example zh, example pinyin, example en] n=Taiwan usage note */
const VOCAB=[
/* ---------- LEVEL 1 · 基礎 Foundations (來學華語 1-2 / TOCFL Novice) ---------- */
{c:"你好",p:"nǐ hǎo",e:"hello",l:1,d:["daily"],x:["你好，請問你是王先生嗎？","Nǐ hǎo, qǐngwèn nǐ shì Wáng xiānshēng ma?","Hello, are you Mr. Wang?"]},
{c:"請問",p:"qǐngwèn",e:"excuse me, may I ask",l:1,d:["daily"],x:["請問廁所在哪裡？","Qǐngwèn cèsuǒ zài nǎlǐ?","Excuse me, where is the restroom?"]},
{c:"謝謝",p:"xièxie",e:"thank you",l:1,d:["daily"],x:["謝謝你的幫忙。","Xièxie nǐ de bāngmáng.","Thanks for your help."],n:"Reply in Taiwan: 不會 bú huì, not 不客氣."},
{c:"不好意思",p:"bù hǎo yìsi",e:"excuse me / sorry (mild)",l:1,d:["daily"],x:["不好意思，借過一下。","Bù hǎo yìsi, jièguò yíxià.","Excuse me, coming through."],n:"The all-purpose Taiwanese social lubricant — used far more than 對不起."},
{c:"對不起",p:"duìbùqǐ",e:"I'm sorry",l:1,d:["daily"],x:["對不起，我遲到了。","Duìbùqǐ, wǒ chídào le.","Sorry, I'm late."]},
{c:"我",p:"wǒ",e:"I, me",l:1,d:["daily"],x:["我是美國人。","Wǒ shì Měiguó rén.","I'm American."]},
{c:"你",p:"nǐ",e:"you",l:1,d:["daily"],x:["你叫什麼名字？","Nǐ jiào shénme míngzi?","What's your name?"]},
{c:"他",p:"tā",e:"he / she (她)",l:1,d:["daily"],x:["他是我朋友。","Tā shì wǒ péngyǒu.","He's my friend."]},
{c:"我們",p:"wǒmen",e:"we, us",l:1,d:["daily"],x:["我們都是同事。","Wǒmen dōu shì tóngshì.","We're all coworkers."]},
{c:"是",p:"shì",e:"to be",l:1,d:["daily"],x:["這是我的名片。","Zhè shì wǒ de míngpiàn.","This is my business card."]},
{c:"姓",p:"xìng",e:"surname; to be surnamed",l:1,d:["daily"],x:["我姓馬，請多指教。","Wǒ xìng Mǎ, qǐng duō zhǐjiào.","My surname is Ma, pleased to meet you."]},
{c:"叫",p:"jiào",e:"to be called",l:1,d:["daily"],x:["我叫 Eric。","Wǒ jiào Eric.","My name is Eric."]},
{c:"名字",p:"míngzi",e:"name",l:1,d:["daily"],x:["你的中文名字很好聽。","Nǐ de Zhōngwén míngzi hěn hǎotīng.","Your Chinese name sounds nice."]},
{c:"哪",p:"nǎ",e:"which",l:1,d:["daily"],x:["你是哪國人？","Nǐ shì nǎ guó rén?","Which country are you from?"]},
{c:"美國",p:"Měiguó",e:"United States",l:1,d:["daily"],x:["我從美國來。","Wǒ cóng Měiguó lái.","I come from the US."]},
{c:"台灣",p:"Táiwān",e:"Taiwan",l:1,d:["daily"],x:["我很喜歡台灣。","Wǒ hěn xǐhuān Táiwān.","I really like Taiwan."]},
{c:"會",p:"huì",e:"can, know how to; will",l:1,d:["daily"],x:["我會說一點中文。","Wǒ huì shuō yìdiǎn Zhōngwén.","I can speak a little Chinese."]},
{c:"說",p:"shuō",e:"to speak, say",l:1,d:["daily"],x:["請說慢一點。","Qǐng shuō màn yìdiǎn.","Please speak a bit slower."]},
{c:"中文",p:"Zhōngwén",e:"Chinese language",l:1,d:["daily"],x:["你的中文越來越好了！","Nǐ de Zhōngwén yuèláiyuè hǎo le!","Your Chinese keeps getting better!"],n:"In Taiwan also 華語 huáyǔ or 國語 guóyǔ."},
{c:"一點",p:"yìdiǎn",e:"a little",l:1,d:["daily"],x:["再便宜一點好不好？","Zài piányí yìdiǎn hǎo bù hǎo?","A little cheaper, OK?"]},
{c:"學",p:"xué",e:"to study, learn",l:1,d:["daily"],x:["我在學華語。","Wǒ zài xué huáyǔ.","I'm learning Mandarin."]},
{c:"老師",p:"lǎoshī",e:"teacher",l:1,d:["daily"],x:["老師，這個字怎麼念？","Lǎoshī, zhège zì zěnme niàn?","Teacher, how do you read this character?"]},
{c:"朋友",p:"péngyǒu",e:"friend",l:1,d:["daily"],x:["他是我台灣朋友。","Tā shì wǒ Táiwān péngyǒu.","He's my Taiwanese friend."]},
{c:"家人",p:"jiārén",e:"family members",l:1,d:["daily"],x:["我家人都住在美國。","Wǒ jiārén dōu zhù zài Měiguó.","My family all live in the US."]},
{c:"這",p:"zhè",e:"this",l:1,d:["daily"],x:["這是什麼？","Zhè shì shénme?","What is this?"]},
{c:"那",p:"nà",e:"that",l:1,d:["daily"],x:["那個多少錢？","Nàge duōshǎo qián?","How much is that one?"]},
{c:"什麼",p:"shénme",e:"what",l:1,d:["daily"],x:["你想吃什麼？","Nǐ xiǎng chī shénme?","What do you want to eat?"]},
{c:"誰",p:"shéi",e:"who",l:1,d:["daily"],x:["他是誰？","Tā shì shéi?","Who is he?"]},
{c:"多少",p:"duōshǎo",e:"how much, how many",l:1,d:["daily","biz"],x:["這個多少錢？","Zhège duōshǎo qián?","How much is this?"]},
{c:"錢",p:"qián",e:"money",l:1,d:["daily"],x:["我沒帶錢。","Wǒ méi dài qián.","I didn't bring money."]},
{c:"塊",p:"kuài",e:"dollar (spoken measure)",l:1,d:["daily"],x:["五十塊。","Wǔshí kuài.","Fifty dollars (NT)."],n:"NT$ in speech is 塊; written price signs use 元."},
{c:"買",p:"mǎi",e:"to buy",l:1,d:["daily"],x:["我想買一杯咖啡。","Wǒ xiǎng mǎi yì bēi kāfēi.","I'd like to buy a coffee."]},
{c:"要",p:"yào",e:"to want; will",l:1,d:["daily"],x:["我要這個。","Wǒ yào zhège.","I want this one."]},
{c:"有",p:"yǒu",e:"to have; there is",l:1,d:["daily"],x:["有沒有大杯的？","Yǒu méiyǒu dà bēi de?","Do you have a large size?"]},
{c:"吃",p:"chī",e:"to eat",l:1,d:["daily"],x:["你吃飯了嗎？","Nǐ chīfàn le ma?","Have you eaten?"],n:"Common Taiwanese greeting, not a literal question."},
{c:"喝",p:"hē",e:"to drink",l:1,d:["daily"],x:["你想喝什麼？","Nǐ xiǎng hē shénme?","What would you like to drink?"]},
{c:"水",p:"shuǐ",e:"water",l:1,d:["daily"],x:["請給我一杯水。","Qǐng gěi wǒ yì bēi shuǐ.","Please give me a glass of water."]},
{c:"茶",p:"chá",e:"tea",l:1,d:["daily"],x:["台灣的茶很有名。","Táiwān de chá hěn yǒumíng.","Taiwan's tea is famous."]},
{c:"咖啡",p:"kāfēi",e:"coffee",l:1,d:["daily"],x:["我每天早上喝咖啡。","Wǒ měitiān zǎoshang hē kāfēi.","I drink coffee every morning."]},
{c:"好吃",p:"hǎochī",e:"delicious",l:1,d:["daily"],x:["夜市的東西都很好吃。","Yèshì de dōngxi dōu hěn hǎochī.","Everything at the night market is delicious."]},
{c:"今天",p:"jīntiān",e:"today",l:1,d:["daily"],x:["今天天氣很好。","Jīntiān tiānqì hěn hǎo.","The weather is nice today."]},

{them:{zh:"好的。你的中文不錯欸！來台灣多久了？",py:"Hǎo de. Nǐ de Zhōngwén búcuò éi! Lái Táiwān duōjiǔ le?",en:"Sure. Your Chinese is pretty good! How long have you been in Taiwan?"},task:"Say you've been here two weeks; you're here for work.",ans:{zh:"我來兩個星期了，我是來工作的。",py:"Wǒ lái liǎng ge xīngqí le, wǒ shì lái gōngzuò de.",en:"I've been here two weeks. I'm here for work."},keys:"兩個星期工作"},
{them:{zh:"這個時間有一點塞車，可能要二十分鐘喔。",py:"Zhège shíjiān yǒu yìdiǎn sāichē, kěnéng yào èrshí fēnzhōng o.",en:"Traffic's a bit heavy right now — maybe twenty minutes."},task:"Say no problem, you're not in a hurry.",ans:{zh:"沒關係，我不趕時間。",py:"Méi guānxi, wǒ bù gǎn shíjiān.",en:"No worries, I'm not in a hurry."},keys:"沒關係趕時間"},
{them:{zh:"到了，台北車站。總共兩百三十塊。",py:"Dào le, Táiběi chēzhàn. Zǒnggòng liǎngbǎi sānshí kuài.",en:"Here we are, Taipei Main Station. 230 total."},task:"Say you'll pay cash, and ask for a receipt.",ans:{zh:"我付現金。麻煩給我收據，謝謝。",py:"Wǒ fù xiànjīn. Máfán gěi wǒ shōujù, xièxie.",en:"I'll pay cash. Could I get a receipt, thanks."},keys:"現金收據"},
{them:{zh:"好，收據在這裡。祝你工作順利！",py:"Hǎo, shōujù zài zhèlǐ. Zhù nǐ gōngzuò shùnlì!",en:"Here's your receipt. Good luck with work!"},task:"Thank him and say goodbye.",ans:{zh:"謝謝你，再見！",py:"Xièxie nǐ, zàijiàn!",en:"Thanks! Bye!"},keys:"謝謝再見"}]},

{id:"boba",l:2,zh:"手搖飲點餐",en:"Ordering Bubble Tea",who:"店員 Clerk",intro:"You're at a drink stand. Order a bubble tea exactly how you like it — sweetness, ice, size — and handle the receipt-and-bag questions.",
turns:[
{them:{zh:"歡迎光臨！請問要點什麼？",py:"Huānyíng guānglín! Qǐngwèn yào diǎn shénme?",en:"Welcome! What would you like?"},task:"Order one large bubble milk tea.",ans:{zh:"我要一杯大杯的珍珠奶茶。",py:"Wǒ yào yì bēi dàbēi de zhēnzhū nǎichá.",en:"One large bubble milk tea, please."},keys:"大杯珍珠奶茶"},
{them:{zh:"好的，甜度冰塊呢？",py:"Hǎo de, tiándù bīngkuài ne?",en:"Sure — sweetness and ice level?"},task:"Say: half sugar, less ice.",ans:{zh:"半糖少冰，謝謝。",py:"Bàntáng shǎobīng, xièxie.",en:"Half sugar, less ice, thanks."},keys:"半糖少冰"},
{them:{zh:"這樣一共六十五塊。需要袋子嗎？袋子要加一塊喔。",py:"Zhèyàng yígòng liùshíwǔ kuài. Xūyào dàizi ma? Dàizi yào jiā yí kuài o.",en:"That's 65 total. Need a bag? Bags are one dollar extra."},task:"Say no bag needed; you'll pay with EasyCard.",ans:{zh:"不用袋子，我用悠遊卡付。",py:"Búyòng dàizi, wǒ yòng Yōuyóukǎ fù.",en:"No bag. I'll pay with EasyCard."},keys:"不用袋子悠遊卡"},
{them:{zh:"好，發票幫您印出來。請稍等，做好叫您。",py:"Hǎo, fāpiào bāng nín yìn chūlái. Qǐng shāoděng, zuòhǎo jiào nín.",en:"OK, I'll print your receipt. One moment — we'll call you when it's ready."},task:"Say thanks — and ask them to make it less sweet if possible (you're cutting back!).",ans:{zh:"謝謝。可以的話請做淡一點，我最近在減糖。",py:"Xièxie. Kěyǐ dehuà qǐng zuò dàn yìdiǎn, wǒ zuìjìn zài jiǎn táng.",en:"Thanks. If possible make it on the light side — I'm cutting sugar lately."},keys:"淡一點減糖"},
{them:{zh:"沒問題！您的珍奶好了，請慢用！",py:"Méi wèntí! Nín de zhēnnǎi hǎo le, qǐng mànyòng!",en:"No problem! Your boba's ready — enjoy!"},task:"Thank them with the local 'thanks / no rush' tone.",ans:{zh:"謝謝，辛苦了！",py:"Xièxie, xīnkǔ le!",en:"Thanks — appreciate your work!"},keys:"謝謝辛苦"}]},

{id:"hotel",l:2,zh:"飯店入住",en:"Hotel Check-in",who:"櫃檯 Front Desk",intro:"You arrive at your Taipei hotel after a long flight. Check in, confirm breakfast and Wi-Fi, and store your luggage timing.",
turns:[
{them:{zh:"晚安，歡迎光臨。請問有訂房嗎？",py:"Wǎn'ān, huānyíng guānglín. Qǐngwèn yǒu dìngfáng ma?",en:"Good evening, welcome. Do you have a reservation?"},task:"Say yes, you booked a double room; your surname is Ma.",ans:{zh:"有，我訂了一間雙人房，我姓馬。",py:"Yǒu, wǒ dìng le yì jiān shuāngrén fáng, wǒ xìng Mǎ.",en:"Yes, I booked a double room. Surname Ma."},keys:"訂雙人房姓"},
{them:{zh:"馬先生您好，麻煩給我看一下護照。住三個晚上，含早餐，對嗎？",py:"Mǎ xiānshēng nín hǎo, máfán gěi wǒ kàn yíxià hùzhào. Zhù sān ge wǎnshàng, hán zǎocān, duì ma?",en:"Hello Mr. Ma — your passport please. Three nights with breakfast, correct?"},task:"Confirm, and ask what time breakfast is.",ans:{zh:"對。請問早餐是幾點到幾點？",py:"Duì. Qǐngwèn zǎocān shì jǐ diǎn dào jǐ diǎn?",en:"Correct. What time is breakfast served?"},keys:"早餐幾點"},
{them:{zh:"早餐是六點半到十點，在二樓餐廳。這是您的房卡，八一五號房。",py:"Zǎocān shì liù diǎn bàn dào shí diǎn, zài èr lóu cāntīng. Zhè shì nín de fángkǎ, bā yāo wǔ hào fáng.",en:"Breakfast is 6:30–10:00 in the 2nd floor restaurant. Here's your key card — room 815."},task:"Ask for the Wi-Fi password.",ans:{zh:"謝謝。請問無線網路的密碼是什麼？",py:"Xièxie. Qǐngwèn wúxiàn wǎnglù de mìmǎ shì shénme?",en:"Thanks. What's the Wi-Fi password?"},keys:"網路密碼"},
{them:{zh:"密碼就在房卡的套子上。還有其他需要嗎？",py:"Mìmǎ jiù zài fángkǎ de tàozi shàng. Háiyǒu qítā xūyào ma?",en:"The password's on the key card sleeve. Anything else?"},task:"Ask: on checkout day, can they store your luggage until evening?",ans:{zh:"退房那天可以幫我寄放行李到晚上嗎？",py:"Tuìfáng nà tiān kěyǐ bāng wǒ jìfàng xínglǐ dào wǎnshàng ma?",en:"On checkout day, could you store my luggage until evening?"},keys:"寄放行李晚上"},
{them:{zh:"當然可以，跟櫃檯說一聲就好。祝您住宿愉快！",py:"Dāngrán kěyǐ, gēn guìtái shuō yì shēng jiù hǎo. Zhù nín zhùsù yúkuài!",en:"Of course — just tell the front desk. Enjoy your stay!"},task:"Thank them politely.",ans:{zh:"太好了，麻煩你們了，謝謝！",py:"Tài hǎo le, máfán nǐmen le, xièxie!",en:"Great — much obliged, thank you!"},keys:"麻煩謝謝"}]},

{id:"clinic",l:3,zh:"診所看病",en:"At the Clinic",who:"櫃檯/醫生 Desk & Doctor",intro:"You've had a sore throat and slight fever for two days. Register at a neighborhood clinic and describe your symptoms.",
turns:[
{them:{zh:"你好，請問要看診嗎？有沒有健保卡？",py:"Nǐ hǎo, qǐngwèn yào kànzhěn ma? Yǒu méiyǒu jiànbǎokǎ?",en:"Hello — here to see the doctor? Do you have an NHI card?"},task:"Say you'd like to see a doctor; you don't have NHI, you'll pay out of pocket.",ans:{zh:"我要看診。我沒有健保，自費沒關係。",py:"Wǒ yào kànzhěn. Wǒ méiyǒu jiànbǎo, zìfèi méi guānxi.",en:"I'd like to see the doctor. No NHI — out of pocket is fine."},keys:"看診健保自費"},
{them:{zh:"好的，先幫您掛號。請坐一下，等叫號。",py:"Hǎo de, xiān bāng nín guàhào. Qǐng zuò yíxià, děng jiàohào.",en:"OK, I'll register you. Please have a seat until your number is called."},task:"(Now with the doctor) Describe: sore throat and a slight fever for two days.",ans:{zh:"醫生你好，我喉嚨痛，有點發燒，已經兩天了。",py:"Yīshēng nǐ hǎo, wǒ hóulóng tòng, yǒudiǎn fāshāo, yǐjīng liǎng tiān le.",en:"Doctor, my throat hurts and I have a slight fever — two days now."},keys:"喉嚨痛發燒兩天"},
{them:{zh:"嘴巴張開我看一下……喉嚨有點發炎。有沒有咳嗽或流鼻水？",py:"Zuǐbā zhāngkāi wǒ kàn yíxià... hóulóng yǒudiǎn fāyán. Yǒu méiyǒu késòu huò liú bíshuǐ?",en:"Open up, let me look… throat's a bit inflamed. Any cough or runny nose?"},task:"Say a little cough, no runny nose. Ask if it's serious.",ans:{zh:"有一點咳嗽，沒有流鼻水。請問嚴重嗎？",py:"Yǒu yìdiǎn késòu, méiyǒu liú bíshuǐ. Qǐngwèn yánzhòng ma?",en:"A little cough, no runny nose. Is it serious?"},keys:"咳嗽流鼻水嚴重"},
{them:{zh:"不嚴重，一般的感冒。我開三天的藥，一天三次，飯後吃。",py:"Bù yánzhòng, yìbān de gǎnmào. Wǒ kāi sān tiān de yào, yì tiān sān cì, fànhòu chī.",en:"Not serious — a common cold. I'll prescribe three days of medicine: three times daily, after meals."},task:"Ask whether you can drink coffee while on the medicine.",ans:{zh:"好的。請問吃藥的時候可以喝咖啡嗎？",py:"Hǎo de. Qǐngwèn chī yào de shíhòu kěyǐ hē kāfēi ma?",en:"OK. Can I drink coffee while taking the medicine?"},keys:"吃藥咖啡"},
{them:{zh:"最好不要，多喝溫開水，多休息。三天沒好再回來。",py:"Zuìhǎo búyào, duō hē wēn kāishuǐ, duō xiūxí. Sān tiān méi hǎo zài huílái.",en:"Better not — drink warm water and rest. Come back if you're not better in three days."},task:"Thank the doctor and say you understand.",ans:{zh:"我知道了，謝謝醫生！",py:"Wǒ zhīdào le, xièxie yīshēng!",en:"Understood — thank you, doctor!"},keys:"知道謝謝醫生"}]},

{id:"meeting",l:4,zh:"商務會議",en:"Business Meeting Opening",who:"陳經理 Manager Chen",intro:"First meeting with a prospective Taiwanese partner company. Open politely, introduce yourself and your company, and set up the agenda.",
turns:[
{them:{zh:"歡迎歡迎！我是陳經理，久仰大名。",py:"Huānyíng huānyíng! Wǒ shì Chén jīnglǐ, jiǔyǎng dàmíng.",en:"Welcome! I'm Manager Chen — I've heard a lot about you."},task:"Introduce yourself: name, innovation engineer, here on behalf of your company. Offer your card.",ans:{zh:"陳經理您好，我叫 Eric，是創新工程師。這是我的名片，請多指教。",py:"Chén jīnglǐ nín hǎo, wǒ jiào Eric, shì chuàngxīn gōngchéngshī. Zhè shì wǒ de míngpiàn, qǐng duō zhǐjiào.",en:"Hello Manager Chen. I'm Eric, an innovation engineer. Here's my card — pleased to meet you."},keys:"創新工程師名片指教"},
{them:{zh:"請坐請坐。聽說你們公司專門做無人系統？",py:"Qǐng zuò qǐng zuò. Tīngshuō nǐmen gōngsī zhuānmén zuò wúrén xìtǒng?",en:"Please, sit. I hear your company specializes in unmanned systems?"},task:"Confirm: yes, mainly unmanned systems — you handle new technology evaluation and integration.",ans:{zh:"對，我們主要做無人系統。我負責新技術的評估跟整合。",py:"Duì, wǒmen zhǔyào zuò wúrén xìtǒng. Wǒ fùzé xīn jìshù de pínggū gēn zhěnghé.",en:"Right, mainly unmanned systems. I handle new tech evaluation and integration."},keys:"無人系統負責技術整合"},
{them:{zh:"太好了。我們正在找合作夥伴。今天想先了解你們的產品跟報價。",py:"Tài hǎo le. Wǒmen zhèngzài zhǎo hézuò huǒbàn. Jīntiān xiǎng xiān liǎojiě nǐmen de chǎnpǐn gēn bàojià.",en:"Excellent. We're looking for partners. Today we'd like to understand your products and pricing."},task:"Propose an agenda: first a 10-minute briefing, then discuss requirements, then talk price.",ans:{zh:"沒問題。我建議先做十分鐘的簡報，再討論你們的需求，最後談報價。",py:"Méi wèntí. Wǒ jiànyì xiān zuò shí fēnzhōng de jiǎnbào, zài tǎolùn nǐmen de xūqiú, zuìhòu tán bàojià.",en:"Sure. I suggest a 10-minute briefing first, then your requirements, and finally pricing."},keys:"建議簡報需求報價"},
{them:{zh:"很好。對了，價格方面，我們的預算比較有限。",py:"Hěn hǎo. Duìle, jiàgé fāngmiàn, wǒmen de yùsuàn bǐjiào yǒuxiàn.",en:"Great. By the way, on price — our budget is rather limited."},task:"Reassure them: pricing is flexible; quality and long-term cooperation matter most to you.",ans:{zh:"價格可以談。對我們來說，品質跟長期合作最重要。",py:"Jiàgé kěyǐ tán. Duì wǒmen láishuō, pǐnzhí gēn chángqí hézuò zuì zhòngyào.",en:"Price is negotiable. For us, quality and long-term cooperation matter most."},keys:"價格品質長期合作"},
{them:{zh:"我們的想法一樣。那就開始吧，請！",py:"Wǒmen de xiǎngfǎ yíyàng. Nà jiù kāishǐ ba, qǐng!",en:"We think alike. Let's begin — please!"},task:"Thank him and kick off your briefing.",ans:{zh:"謝謝。那我開始簡報，有問題請隨時打斷我。",py:"Xièxie. Nà wǒ kāishǐ jiǎnbào, yǒu wèntí qǐng suíshí dǎduàn wǒ.",en:"Thanks. I'll start the briefing — feel free to interrupt with questions."},keys:"開始簡報問題隨時"}]},

{id:"demo",l:6,zh:"向政府客戶簡報",en:"UxS Briefing to a Government Customer",who:"林處長 Director Lin",intro:"You're briefing a government delegation on your company's unmanned systems. Handle capability questions in Mandarin: endurance, payload, comms loss, and procurement.",
turns:[
{them:{zh:"Eric 你好。先請教一下，這款無人機的續航力跟酬載是多少？",py:"Eric nǐ hǎo. Xiān qǐngjiào yíxià, zhè kuǎn wúrénjī de xùhánglì gēn chóuzài shì duōshǎo?",en:"Hello Eric. First — what are this UAV's endurance and payload?"},task:"Answer: endurance about 8 hours; max payload 5 kg, supporting EO sensors.",ans:{zh:"續航力大約八個小時，最大酬載五公斤，可以搭載光電感測器。",py:"Xùhánglì dàyuē bā ge xiǎoshí, zuìdà chóuzài wǔ gōngjīn, kěyǐ dāzài guāngdiàn gǎncèqì.",en:"Endurance is about 8 hours; max payload 5 kg, and it can carry EO sensors."},keys:"續航力八小時酬載五公斤感測器"},
{them:{zh:"如果通訊被干擾，中斷了，系統會怎麼處理？",py:"Rúguǒ tōngxùn bèi gānrǎo, zhōngduàn le, xìtǒng huì zěnme chǔlǐ?",en:"If comms are jammed and the link drops, how does the system respond?"},task:"Explain: on link loss it switches to autonomous mode and auto-returns to launch.",ans:{zh:"通訊中斷的時候，系統會切換到自主模式，自動返航。",py:"Tōngxùn zhōngduàn de shíhòu, xìtǒng huì qiēhuàn dào zìzhǔ móshì, zìdòng fǎnháng.",en:"On link loss, it switches to autonomous mode and automatically returns to launch."},keys:"通訊中斷自主返航"},
{them:{zh:"我們主要的需求是海上監偵任務。你們有實際部署的經驗嗎？",py:"Wǒmen zhǔyào de xūqiú shì hǎishàng jiānzhēn rènwù. Nǐmen yǒu shíjì bùshǔ de jīngyàn ma?",en:"Our main requirement is maritime ISR missions. Do you have real deployment experience?"},task:"Say yes — deployed with multiple partners; you can arrange a live flight demonstration.",ans:{zh:"有，我們跟多個夥伴實際部署過。我們也可以安排現場的飛行展示。",py:"Yǒu, wǒmen gēn duō ge huǒbàn shíjì bùshǔguò. Wǒmen yě kěyǐ ānpái xiànchǎng de fēixíng zhǎnshì.",en:"Yes — we've deployed with several partners, and we can arrange a live flight demo."},keys:"部署夥伴安排飛行展示"},
{them:{zh:"不錯。不過採購要走標案程序，時程可能比較長，你們可以配合嗎？",py:"Búcuò. Búguò cǎigòu yào zǒu biāo'àn chéngxù, shíchéng kěnéng bǐjiào cháng, nǐmen kěyǐ pèihé ma?",en:"Good. But procurement must go through the tender process — timelines can be long. Can you accommodate that?"},task:"Confirm you understand the tender process and will fully cooperate; ask when the tender is expected to open.",ans:{zh:"我們了解標案程序，一定全力配合。請問預計什麼時候招標？",py:"Wǒmen liǎojiě biāo'àn chéngxù, yídìng quánlì pèihé. Qǐngwèn yùjì shénme shíhòu zhāobiāo?",en:"We understand the tender process and will fully cooperate. When do you expect bids to open?"},keys:"標案程序配合招標"},
{them:{zh:"大概明年第一季。今天談得很好，後續請跟我們的承辦人聯絡。",py:"Dàgài míngnián dì yī jì. Jīntiān tán de hěn hǎo, hòuxù qǐng gēn wǒmen de chéngbànrén liánluò.",en:"Probably Q1 next year. Good discussion today — please follow up with our case officer."},task:"Thank the director; say you'll send the specs and quote by email this week.",ans:{zh:"謝謝處長。我們這禮拜會把規格跟報價用電子郵件寄過去。",py:"Xièxie chùzhǎng. Wǒmen zhè lǐbài huì bǎ guīgé gēn bàojià yòng diànzǐ yóujiàn jì guòqù.",en:"Thank you, Director. We'll email the specs and quote this week."},keys:"處長規格報價郵件"}]},

{id:"opinion",l:5,zh:"時事訪談",en:"Current Events Interview (OPI-style)",who:"主持人 Host",intro:"A podcast host interviews you about tech and defense topics. OPI raters want supported opinions: state a view, give reasons, handle a follow-up. Speak in paragraphs, not sentences.",
turns:[
{them:{zh:"今天邀請到一位在無人系統產業工作的來賓。可以先簡單介紹一下你的工作嗎？",py:"Jīntiān yāoqǐng dào yí wèi zài wúrén xìtǒng chǎnyè gōngzuò de láibīn. Kěyǐ xiān jiǎndān jièshào yíxià nǐ de gōngzuò ma?",en:"Today's guest works in the unmanned systems industry. Could you briefly introduce your work?"},task:"Give a 2-3 sentence intro: innovation engineer, unmanned systems, working with businesses and governments.",ans:{zh:"大家好。我是創新工程師，在無人系統產業工作，主要負責新技術的評估，也常常跟企業和政府單位合作。",py:"Dàjiā hǎo. Wǒ shì chuàngxīn gōngchéngshī, zài wúrén xìtǒng chǎnyè gōngzuò, zhǔyào fùzé xīn jìshù de pínggū, yě chángcháng gēn qìyè hàn zhèngfǔ dānwèi hézuò.",en:"Hi everyone. I'm an innovation engineer in the unmanned systems industry — I evaluate new technologies and often work with companies and government agencies."},keys:"創新工程師無人系統評估政府合作"},
{them:{zh:"你認為無人機會怎麼改變未來的產業和國防？",py:"Nǐ rènwéi wúrénjī huì zěnme gǎibiàn wèilái de chǎnyè hàn guófáng?",en:"How do you think drones will change industry and defense in the future?"},task:"Give an opinion with two reasons: low cost and low risk → wider use in both civilian and defense fields.",ans:{zh:"我認為影響會非常大。第一，無人機成本低；第二，風險也小，所以不管是民間還是國防，應用一定會越來越廣。",py:"Wǒ rènwéi yǐngxiǎng huì fēicháng dà. Dì yī, wúrénjī chéngběn dī; dì èr, fēngxiǎn yě xiǎo, suǒyǐ bùguǎn shì mínjiān háishì guófáng, yìngyòng yídìng huì yuèláiyuè guǎng.",en:"I think the impact will be huge. First, drones are cheap; second, low-risk — so civilian and defense applications will only widen."},keys:"認為成本風險應用越來越"},

/* ================= STORAGE ================= */
const S={mem:{},ok:true};
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}catch(e){S.ok=false;}
S.load=()=>{try{if(S.ok){const r=localStorage.getItem("twm_state_v1");return r?JSON.parse(r):null;}return S.mem.state||null;}catch(e){return null;}};
S.save=()=>{try{if(S.ok)localStorage.setItem("twm_state_v1",JSON.stringify(ST));else S.mem.state=ST;}catch(e){}};

let ST=S.load()||{placed:false,level:3,session:0,streak:0,lastDay:"",newPer:12,recycleN:5,
srs:{},gradQ:[],custom:[],readDone:{},listenDone:{},scenDone:{},today:{},todayDay:"",
voice:"",rate:0.92,showPy:true,stats:{rev:0,ok:0},slangSeen:0,packs:[],hard:[]};
ST.packs=ST.packs||[];ST.hard=ST.hard||[];

function allVocab(){return VOCAB.concat(ST.custom);}
function vid(i){return i<VOCAB.length?"v"+i:"c"+(i-VOCAB.length);}
function byId(id){const n=parseInt(id.slice(1));return id[0]==="v"?VOCAB[n]:ST.custom[n];}

/* ================= SRS ENGINE =================
   States: (absent)=unseen -> learn -> rev -> grad (leaves main cycle, joins gradQ)
   due measured in session counts. Recycle: after each completed daily lesson,
   ST.recycleN graduated words are pulled back in as review. */
function srsGet(id){return ST.srs[id];}
function srsDue(){const out=[];for(const id in ST.srs){const r=ST.srs[id];if(r.st!=="grad"&&r.due<=ST.session)out.push(id);}return out;}
function srsNewCandidates(){const out=[];const av=allVocab();for(let i=0;i<av.length;i++){const id=vid(i);if(!ST.srs[id]&&av[i].l<=ST.level)out.push(id);}
out.sort((a,b)=>byId(a).l-byId(b).l);return out;}
function grade(id,g){ // g:0 again 1 good 2 easy
  let r=ST.srs[id]||{st:"learn",iv:0,reps:0,due:ST.session};
  ST.stats.rev++;if(g>0)ST.stats.ok++;
  if(g===0){r.st="learn";r.iv=0;r.due=ST.session;r.lapses=(r.lapses||0)+1;}
  else{
    r.reps=(r.reps||0)+1;
    if(r.st==="learn"){r.st="rev";r.iv=g===2?2:1;}
    else{r.iv=Math.max(1,Math.round(r.iv*(g===2?3:2)));}
    r.due=ST.session+r.iv;
    if(r.iv>=8&&r.reps>=4){r.st="grad";if(!ST.gradQ.includes(id))ST.gradQ.push(id);}
  }
  ST.srs[id]=r;S.save();
}
function injectRecycle(){ // pull oldest graduated back for a review pass
  let n=Math.min(ST.recycleN,ST.gradQ.length);
  for(let i=0;i<n;i++){const id=ST.gradQ.shift();const r=ST.srs[id];r.st="rev";r.iv=4;r.due=ST.session;ST.srs[id]=r;ST.gradQ.push(id);} // stays in rotation queue
  return n;
}

/* ================= SPEECH ================= */
let VOICES=[];
function loadVoices(){VOICES=(speechSynthesis.getVoices()||[]).filter(v=>/^zh/i.test(v.lang));}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(){if(!VOICES.length)loadVoices();
  let v=VOICES.find(x=>x.name===ST.voice);if(v)return v;
  v=VOICES.find(x=>/TW/i.test(x.lang))||VOICES.find(x=>/HK/i.test(x.lang))||VOICES[0];return v||null;}
function say(zh,rate){if(!("speechSynthesis" in window)){toast("This browser has no text-to-speech.");return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(zh);const v=pickVoice();
  if(v)u.voice=v;u.lang=v?v.lang:"zh-TW";u.rate=rate||ST.rate;speechSynthesis.speak(u);}
const SRcls=window.SpeechRecognition||window.webkitSpeechRecognition||null;

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600);}
function norm(s){return String(s).replace(/[^\u3400-\u9FFF\uF900-\uFAFF0-9A-Za-z]/g,"");}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}p=c;}return p[n];}
function sim(a,b){a=norm(a);b=norm(b);if(!a.length&&!b.length)return 1;return 1-lev(a,b)/Math.max(a.length,b.length);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function domTags(d){return (d||[]).map(x=>'<span class="tag">'+esc(DOMAINS[x]||x)+'</span>').join("");}
function attrJS(s){return esc(JSON.stringify(s));}
function pyHtml(p){return '<span class="py">'+esc(p)+'</span>';}
function speakerBtn(zh,sm){return '<button class="audiobtn'+(sm?' sm':'')+'" onclick="say('+attrJS(zh)+')" title="Listen">&#9654;</button>';}

/* ================= TODAY ================= */
function ensureToday(){const d=todayStr();
  if(ST.todayDay!==d){ST.todayDay=d;
    const reads=READINGS.map((r,i)=>i).filter(i=>READINGS[i].l===ST.level);
    const read=reads.find(i=>!ST.readDone[i]);
    const lis=LISTENING.map((x,i)=>i).filter(i=>LISTENING[i].l===ST.level);
    const liU=lis.find(i=>!ST.listenDone[i]);
    const li=(liU!==undefined)?liU:(lis.length?lis[0]:0);
    const scByLv=SCENARIOS.map((s,i)=>i).sort((a,b)=>Math.abs(SCENARIOS[a].l-ST.level)-Math.abs(SCENARIOS[b].l-ST.level));
    const sc=scByLv.find(i=>!ST.scenDone[i]);
    ST.today={read:read!==undefined?read:(reads[0]!==undefined?reads[0]:0),
      listen:li>=0?li:0,scen:sc!==undefined?sc:scByLv[0],
      vocabDone:false,readDone:false,listenDone:false,scenDone:false,claimed:false};
    S.save();}
}
function markToday(part){ensureToday();ST.today[part+"Done"]=true;S.save();if(VIEW==="today")render();}
function rToday(){ensureToday();const T=ST.today;
  if(!ST.placed){$("#main").innerHTML='<div class="eyebrow">開始 First things first</div><h1 class="pagetitle">Where should we start?</h1>'+
  '<p class="pagesub">Pick the level that matches you today — you can change it anytime in Settings. You said A2–B1, so Level 3 is the recommended door in.</p>'+
  LEVELS.map(L=>'<div class="card" style="cursor:pointer" onclick="ST.level='+L.n+';ST.placed=true;S.save();render()"><div class="spread"><div><span class="levelchip">L'+L.n+'</span> <b class="zh" style="font-size:20px">'+L.zh+'</b> '+esc(L.en)+(L.n===3?' <span class="tag red">recommended</span>':'')+'<div class="muted">'+esc(L.desc)+'</div></div><div class="muted">'+esc(L.band)+'</div></div></div>').join("");return;}
  const due=srsDue().length,fresh=Math.min(ST.newPer,srsNewCandidates().length);
  const R=READINGS[T.read],Li=LISTENING[T.listen],Sc=SCENARIOS[T.scen];
  const items=[
    {k:"vocab",t:"詞彙 Vocab session",d:due+" due reviews + "+fresh+" new words",done:T.vocabDone,go:"go('vocab')"},
    {k:"read",t:"閱讀 Reading · "+R.title,d:"Level "+R.l+" passage with questions",done:T.readDone,go:"openReading("+T.read+")"},
    {k:"listen",t:"聽力 Listening · Level "+Li.l,d:Li.dict.length+" dictations + 1 passage",done:T.listenDone,go:"openListen("+T.listen+")"},
    {k:"scen",t:"會話 Scenario · "+Sc.zh+" "+Sc.en,d:"Speak with "+Sc.who,done:T.scenDone,go:"openScen("+T.scen+")"}];
  const doneN=items.filter(i=>i.done).length;
  const slang=SLANG[Math.floor(Date.now()/864e5)%SLANG.length];
  let h='<div class="eyebrow">'+todayStr()+' · session '+(ST.session+1)+'</div><h1 class="pagetitle">今日課 Today\'s Lesson</h1>'+
  '<p class="pagesub">One pass through all four skills ≈ 45–60 min. Streak counts <b>sessions</b>, not calendar days — every-other-day keeps it alive.</p>'+
  '<div class="progressbar" style="margin-bottom:18px"><div style="width:'+(doneN/4*100)+'%"></div></div>'+
  items.map(i=>'<div class="card"><div class="spread"><div><b>'+i.t+'</b><div class="muted">'+esc(i.d)+'</div></div><div class="row">'+(i.done?'<span class="stamp" style="width:44px;height:44px;font-size:20px">畢</span>':'<button class="btn red" onclick="'+i.go+'">Start</button>')+'</div></div></div>').join("");
  h+='<div class="card" style="background:#FDF7EC"><div class="eyebrow" style="color:var(--gold)">今日台灣味 Slang of the day</div><div class="row" style="align-items:baseline"><span class="zh" style="font-size:26px;font-weight:900">'+esc(slang.c)+'</span> '+pyHtml(slang.p)+' <span>'+esc(slang.e)+'</span> '+speakerBtn(slang.x[0],1)+'</div><div class="muted zh" style="font-size:15px">'+esc(slang.x[0])+'</div><div class="muted">'+esc(slang.x[2])+(slang.n?" · "+esc(slang.n):"")+'</div></div>';
  if(doneN===4&&!T.claimed){h+='<div class="card" style="text-align:center"><button class="btn jade" onclick="finishSession()">Complete session · stamp it 蓋章</button></div>';}
  if(T.claimed){h+='<div class="card" style="text-align:center"><span class="stamp">完</span><div style="margin-top:10px"><b>Session '+ST.session+' complete.</b> '+(ST.gradQ.length?ST.recycleN+" graduated words were recycled into your next review pile.":"")+'</div></div>';}

function finishSession(){ST.session++;const d=todayStr();
  if(ST.lastDay!==d){ST.streak++;ST.lastDay=d;}
  ST.today.claimed=true;injectRecycle();S.save();render();toast("蓋章！Session "+ST.session+" in the books.");}

/* ================= VOCAB ================= */
let VQ=null; // {ids:[],i,revealed,mode}
function buildQueue(){const due=srsDue();const fresh=srsNewCandidates().slice(0,ST.newPer);

function bubble(m,side,noEn){return '<div class="dlgline '+side+'"><div class="who">'+(side==="them"?"對":"你")+'</div><div class="dlgbubble"><div class="dlg-zh">'+esc(m.zh)+'</div><div class="dlg-py">'+esc(m.py)+'</div>'+(noEn?"":'<div class="dlg-en">'+esc(m.en)+'</div>')+'</div></div>';}
function listen(){if(!SRcls)return;const rec=new SRcls();rec.lang="zh-TW";rec.interimResults=false;rec.maxAlternatives=3;
  SP.listening=true;render();
  rec.onresult=e=>{let best="",bs=-1;const t=SCENARIOS[SP.idx].turns[SP.ti];
    for(const alt of e.results[0]){const s=scoreAns(alt.transcript,t);if(s>bs){bs=s;best=alt.transcript;}}
    SP.transcript=best;SP.score=bs;SP.listening=false;render();};
  rec.onerror=()=>{SP.listening=false;toast("Mic error — check permissions, or use Show answer.");render();};
  rec.onend=()=>{if(SP&&SP.listening){SP.listening=false;render();}};
  rec.start();}
function scoreAns(said,t){const s1=sim(said,t.ans.zh);
  const keys=norm(t.keys||"");let hit=0;for(const ch of keys)if(norm(said).includes(ch))hit++;
  const s2=keys.length?hit/keys.length:0;return Math.max(s1,s2*0.9+s1*0.1);}

  if(SP.ti>=s.turns.length){ST.scenDone[SP.idx]=true;S.save();if(SP.idx===ST.today.scen)markToday("scen");
    toast("蓋章！Scenario complete.");SP=null;render();return;}
  render();setTimeout(()=>say(s.turns[SP.ti].them.zh),250);}

/* ================= PROGRESS ================= */
function rProg(){const av=allVocab();const per={};LEVELS.forEach(L=>per[L.n]={tot:0,grad:0,seen:0});
  av.forEach((w,i)=>{per[w.l].tot++;const r=ST.srs[vid(i)];if(r){per[w.l].seen++;if(r.st==="grad")per[w.l].grad++;}});
  const acc=ST.stats.rev?Math.round(ST.stats.ok/ST.stats.rev*100):0;
  const gradTot=Object.values(per).reduce((a,b)=>a+b.grad,0);
  let band="Novice";if(gradTot>40)band="A2 · TOCFL 1";if(gradTot>90)band="B1 · TOCFL 2";if(gradTot>150)band="B2 · TOCFL 3 · ILR 2";if(gradTot>220)band="C1 · TOCFL 4 · ILR 2+/3";if(gradTot>300)band="C1+/C2 track · ILR 3+";
  let h='<div class="eyebrow">Where you stand</div><h1 class="pagetitle">進度 Progress</h1>'+
  '<div class="grid2"><div class="card"><div class="eyebrow">Sessions</div><div class="big-zh" style="font-size:40px">'+ST.session+'</div><div class="muted">streak '+ST.streak+' · review accuracy '+acc+'%</div></div>'+
  '<div class="card"><div class="eyebrow">Working estimate</div><div style="font-size:20px;font-weight:700">'+band+'</div><div class="muted">based on '+gradTot+' graduated words + level position. The only real meter is the mock test — see below.</div></div></div>'+
  '<div class="card"><table class="stats"><tr><th>Level</th><th>Words</th><th>Seen</th><th>Graduated</th><th></th></tr>'+
  LEVELS.map(L=>{const p=per[L.n];const pc=p.tot?Math.round(p.grad/p.tot*100):0;
  return '<tr><td><b class="zh">'+L.zh+'</b> L'+L.n+'</td><td>'+p.tot+'</td><td>'+p.seen+'</td><td>'+p.grad+'</td><td style="width:34%"><div class="progressbar"><div style="width:'+pc+'%"></div></div></td></tr>';}).join("")+'</table></div>'+
  '<div class="card"><b>OPI 4 / DLPT 4 flight plan</b><div style="margin-top:8px;font-size:14.5px">'+
  'ILR 3→4 is won on <b>register control</b> and <b>supported argument</b>, not vocabulary count. Cycle: (1) graduate Levels 5–7 vocab here; (2) every session, one scenario answered in full paragraphs — the 時事訪談 interview is deliberately OPI-shaped: opinion → reasons → concession → rebuttal; (3) 2–3 GLOSS lessons weekly at ILR 2+ then 3 (Resources); (4) read one CNA or 青年日報 article aloud daily, summarize it from memory in Mandarin; (5) monthly self-mock: 15-min recorded monologue on a news topic + one cold TOCFL/DLPT practice passage. When Level 6–7 readings here feel easy, the DLPT curve has genuinely moved.</div></div>';
  $("#main").innerHTML=h;}

/* ================= SETTINGS ================= */
function rSet(){loadVoices();
  let h='<div class="eyebrow">Tune the machine</div><h1 class="pagetitle">設定 Settings</h1>'+
  '<div class="card"><b>Level</b><div class="muted">Current: L'+ST.level+' — sets which new vocab, readings, listening and default scenarios you get.</div>'+lvlBand()+'</div>'+
  '<div class="card"><b>Vocab cycle</b><div class="grid2" style="margin-top:8px"><label>New words per session<input type="number" min="1" max="50" value="'+ST.newPer+'" onchange="ST.newPer=Math.max(1,parseInt(this.value)||12);S.save()"></label>'+
  '<label>Graduated words recycled per session<input type="number" min="0" max="30" value="'+ST.recycleN+'" onchange="ST.recycleN=Math.max(0,parseInt(this.value)||5);S.save()"></label></div>'+
  '<div class="muted" style="margin-top:6px">Your spec: mastered words leave the main cycle, and each completed session pulls a few back for a partial review pass. Tune both numbers here.</div></div>'+
  '<div class="card"><b>Speech</b><div class="grid2" style="margin-top:8px"><label>Voice (zh)<select onchange="ST.voice=this.value;S.save()"><option value="">Auto (prefer zh-TW)</option>'+VOICES.map(v=>'<option value="'+esc(v.name)+'"'+(v.name===ST.voice?" selected":"")+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join("")+'</select></label>'+
  '<label>Rate: <span id="rateVal">'+ST.rate+'</span><input type="range" min="0.5" max="1.3" step="0.05" value="'+ST.rate+'" oninput="ST.rate=parseFloat(this.value);$(\'#rateVal\').textContent=this.value;S.save()"></label></div>'+
  '<div class="row" style="margin-top:8px"><button class="btn sm ghost" onclick="say(\'你好，我是你的台灣華語老師。\')">Test voice</button></div>'+
  '<div class="muted" style="margin-top:6px">No zh-TW voice listed? On Windows: Settings → Time & Language → Speech → add Chinese (Traditional, Taiwan). On macOS: System Settings → Accessibility → Spoken Content → add 美佳 Meijia.</div></div>'+
  '<div class="card"><b>Pinyin</b><div class="row" style="margin-top:6px"><label><input type="checkbox" '+(ST.showPy?"checked":"")+' onchange="ST.showPy=this.checked;S.save()" style="width:auto"> Show pinyin by default in readings</label></div></div>'+
  '<div class="card"><b>Backup</b><div class="row" style="margin-top:8px"><button class="btn sm" onclick="exportState()">Export progress (JSON)</button><label class="btn sm ghost" style="display:inline-block">Import<input type="file" accept=".json" style="display:none" onchange="importState(this)"></label><button class="btn sm red" onclick="if(confirm(\'Wipe all progress?\')){localStorage.removeItem(\'twm_state_v1\');location.reload();}">Reset everything</button></div>'+
  '<div class="muted" style="margin-top:6px">Progress lives in this browser\'s storage'+(S.ok?"":" (⚠ storage blocked here — export often!)")+'. Export a JSON now and then, especially before switching browsers/computers.</div></div>';
  h+='<div class="card"><b>Content packs 內容包</b><div class="muted" style="margin-top:4px">Add-on lesson bundles (readings + listening + scenarios + vocab) generated for you day by day. Importing merges them in permanently — no need to redownload the app, and your progress is untouched.</div>'+
  (ST.packs.length?'<div style="margin-top:8px">'+ST.packs.map(p=>'<div class="vocabrow"><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.date||"")+'</span><span class="tag">'+(p.readings||[]).length+' read</span><span class="tag">'+(p.listening||[]).length+' listen</span><span class="tag">'+(p.scenarios||[]).length+' speak</span></div>').join("")+'</div>':'<div class="muted" style="margin-top:8px">No packs installed yet.</div>')+
  '<div class="row" style="margin-top:10px"><label class="btn sm" style="display:inline-block">Import pack file<input type="file" accept=".json" style="display:none" onchange="importPack(this)"></label></div>'+
  '<div class="hr"></div><b style="font-size:14px">Auto-sync (optional, for phone/hosted use)</b><div class="muted">Point this at your hosted packs folder (e.g. GitHub Pages). On every launch the app automatically looks for date-named packs — pack-YYYY-MM-DD.json — from the last 14 days and installs anything new. No manifest editing needed; a manifest.json ({"packs":[...]}) is only for extra files with other names. Still zero AI — just a static file fetch.</div>'+
  '<input type="text" placeholder="https://yourname.github.io/repo/packs/" value="'+esc(ST.packURL||"")+'" onchange="ST.packURL=this.value.trim();S.save()" style="margin-top:8px">'+
  '<div class="row" style="margin-top:8px"><button class="btn sm jade" onclick="syncPacks(false)">Check for new packs</button></div>'+
  '<div class="hr"></div><b style="font-size:14px">Daily generator prompt</b><div class="muted">Paste this into a Claude scheduled task (or any chat in your project) to get back a ready-to-import pack file. Click to select all.</div>'+
  '<textarea rows="7" readonly style="margin-top:8px;font-family:var(--mono);font-size:11.5px" onclick="this.select()">'+esc(PACK_PROMPT)+'</textarea></div>';
  $("#main").innerHTML=h;}
function exportState(){const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(ST));a.download="taiwan-mandarin-progress.json";a.click();}
function importState(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{ST=JSON.parse(r.result);S.save();toast("Progress imported.");render();}catch(e){toast("That file didn't parse.");}};r.readAsText(f);}

/* ================= CONTENT PACKS ================= */
const PACK_PROMPT=`Generate today's content pack for my local Taiwanese Mandarin app. Output exactly ONE downloadable JSON file named pack-YYYY-MM-DD.json (today's date) and nothing else. STRICT: valid JSON only, no trailing commas. Traditional characters with Taiwan-standard pinyin (xīngqí, pǐnzhí, gōngjí, wéijī, xiāoxí); pinyin always alongside characters, never replacing them; no bopomofo, no simplified. PROGRESSION IS THE CORE JOB: search this project's earlier packs, find the highest day number and vocabulary already taught; today is day N+1 and must reuse about a third of prior vocabulary in new contexts while adding new material; never re-teach an old word as new; put the day number in the pack name. LEVEL RAMP: start L1 (days 1-10 mostly L1), then L2 (11-25), L3 (26-45), climbing gradually through L4 workplace, L5 news, L6 defense/UxS/government, toward L7 formal; every section gets one stretch item from one level up and one easy review item; weave my professional world (unmanned systems, meetings, government customers) in from day one at simple levels. QUANTITIES: {"id":"pack-YYYY-MM-DD","name":"Day N - theme","date":"YYYY-MM-DD","readings":[5],"listening":[2],"scenarios":[5],"vocab":[20],"slang":[2]} where each listening set has 5 dictations + 1 passage. SCHEMAS: readings {"l":1-7,"title":"","toks":[["trad","pinyin","gloss"] per word, ["punct"] alone],"qs":[3x{"q","ch":[4],"a":index}],"gram":{"t","d"}}; listening {"l","dict":[5x{"zh","py","en"}],"pass":{"zh":"60-120 chars","qs":[2-3 MCQs]}}; scenarios {"id":"unique","l","zh","en","who","intro","turns":[5-6x{"them":{"zh","py","en"},"task":"mission in English","ans":{"zh","py","en"},"keys":"key chars"}]}; vocab {"c","p","e","l","d":["daily|biz|gov|mil|tech|news|formal"],"x":[zh,py,en],"n":"TW note optional"}; slang same minus l,d. Realistic Taiwan situations, natural speech (o, la, ho), honest grammar notes. My profile: American engineer, unmanned systems, works with businesses/governments/military; targets OPI 4 / DLPT 4. After the file, print the filename on its own line.`;
function installPack(p){
  if(!p||!p.id)return "Not a pack: missing id.";
  if(ST.packs.some(x=>x.id===p.id))return "Pack "+p.id+" is already installed.";
  (p.vocab||[]).forEach(w=>ST.custom.push({c:w.c,p:w.p||"—",e:w.e,l:w.l||ST.level,d:w.d||["daily"],x:w.x||null,n:w.n}));
  const st={id:p.id,name:p.name||p.id,date:p.date||"",readings:p.readings||[],listening:p.listening||[],scenarios:p.scenarios||[],slang:p.slang||[]};
  ST.packs.push(st);
  st.readings.forEach(x=>READINGS.push(x));st.listening.forEach(x=>LISTENING.push(x));
  st.scenarios.forEach(x=>SCENARIOS.push(x));st.slang.forEach(x=>SLANG.push(x));
  S.save();return null;}
function importPack(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const err=installPack(JSON.parse(r.result));toast(err||"Pack installed 安裝完成！");if(!err)render();}
  catch(e){toast("That file didn't parse as a pack.");}};r.readAsText(f);}
function syncPacks(quiet){if(!ST.packURL){if(!quiet)toast("Set a pack URL first.");return;}
  const base=ST.packURL.replace(/\/?$/,"/");
  const probes=[];for(let i=-1;i<14;i++){probes.push("pack-"+new Date(Date.now()-i*864e5).toISOString().slice(0,10)+".json");}
  fetch(base+"manifest.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
  .then(m=>{const listed=(m&&m.packs)||[];const files=[...new Set(listed.concat(probes))];
    let chain=Promise.resolve(0);
    files.forEach(f=>{chain=chain.then(n=>fetch(base+f,{cache:"no-store"})
      .then(r=>{if(!r.ok)throw 0;return r.json();})
      .then(p=>installPack(p)?n:n+1).catch(()=>n));});
    chain.then(n=>{if(n){toast(n+" new pack"+(n>1?"s":"")+" installed.");render();}
      else if(!quiet)toast("You're up to date.");});
  });}
function applyPacks(){ST.packs.forEach(p=>{(p.readings||[]).forEach(x=>READINGS.push(x));
  (p.listening||[]).forEach(x=>LISTENING.push(x));(p.scenarios||[]).forEach(x=>SCENARIOS.push(x));
  (p.slang||[]).forEach(x=>SLANG.push(x));});}

/* ================= BOOT ================= */
applyPacks();render();if(ST.packURL)syncPacks(true);
</script>
